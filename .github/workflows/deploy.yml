name: Deploy site to AWS

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # for AWS OIDC role login

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      HAS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy settings
        run: |
          if [ -z "$S3_BUCKET" ]; then
            echo "::error::Set the repository variable S3_BUCKET (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          if [ -z "$AWS_ROLE_ARN" ] && [ "$HAS_ACCESS_KEY" != "true" ]; then
            echo "::error::Add either the AWS_ROLE_ARN secret or the AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets."
            exit 1
          fi

      - name: AWS login (OIDC role)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: AWS login (access keys)
        if: env.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload images and fonts (cached for a week)
        run: |
          aws s3 sync site/ "s3://$S3_BUCKET/" --delete \
            --exclude "*.html" --exclude "config.js" --exclude "main.js" --exclude "styles.css" \
            --cache-control "public, max-age=604800"

      - name: Upload pages, styles and scripts (always revalidated)
        run: |
          aws s3 sync site/ "s3://$S3_BUCKET/" \
            --exclude "*" --include "*.html" --include "config.js" --include "main.js" --include "styles.css" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Refresh CloudFront
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
