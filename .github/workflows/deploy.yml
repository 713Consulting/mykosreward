name: Deploy site to AWS

on:
  push:
    branches: [main, claude/mykos-reward-domain-migration-xuynx2]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # for AWS OIDC role login

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      HAS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy settings
        run: |
          if [ -z "$AWS_ROLE_ARN" ] && [ "$HAS_ACCESS_KEY" != "true" ]; then
            echo "::notice::No AWS keys in the repository secrets yet; skipping the deploy."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: AWS login (OIDC role)
        if: env.SKIP != 'true' && env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: AWS login (access keys)
        if: env.SKIP != 'true' && env.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the bucket and CloudFront distribution
        if: env.SKIP != 'true'
        run: |
          if [ -z "$S3_BUCKET" ]; then
            echo "S3_BUCKET=mykosreward-site-$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"
          fi
          if [ -z "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='mykosreward.com site'].Id | [0]" --output text)
            if [ "$ID" != "None" ]; then echo "CLOUDFRONT_DISTRIBUTION_ID=$ID" >> "$GITHUB_ENV"; fi
          fi

      - name: Upload images and fonts (cached for a week)
        if: env.SKIP != 'true'
        run: |
          aws s3 sync site/ "s3://$S3_BUCKET/" --delete \
            --exclude "*.html" --exclude "config.js" --exclude "main.js" --exclude "styles.css" \
            --cache-control "public, max-age=604800"

      - name: Upload pages, styles and scripts (always revalidated)
        if: env.SKIP != 'true'
        run: |
          aws s3 sync site/ "s3://$S3_BUCKET/" \
            --exclude "*" --include "*.html" --include "config.js" --include "main.js" --include "styles.css" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Refresh CloudFront
        if: env.SKIP != 'true' && env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
